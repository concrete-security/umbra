[project]
name = "concrete-security-cvm"
version = "0.1.0"
description = "Concrete Security CVM services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concrete_security_cvm"]
