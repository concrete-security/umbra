[project]
name = "umbra-security-cvm"
version = "0.1.0"
description = "Umbra Security CVM services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Umbra Security maintainers" }]
maintainers = [{ name = "Umbra Security maintainers" }]
license = "LicenseRef-Proprietary"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42,<47",
    "google-re2>=1,<2",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.optional-dependencies]
mitmproxy = ["mitmproxy>=11,<12"]

[project.scripts]
umbra-security-mitmproxy = "umbra_security_cvm.mitmproxy_runtime:main"
umbra-security-management = "umbra_security_cvm.management_http:main"
umbra-security-runtime = "umbra_security_cvm.runtime:main"
umbra-security-proxy-tunnel = "umbra_security_cvm.proxy_tunnel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umbra_security_cvm"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv/**",
    "/**/__pycache__/**",
    "/**/*.py[cod]",
    "/node_modules/**",
]
