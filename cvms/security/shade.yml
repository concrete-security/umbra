app:
  name: mitmproxy

services:
  mitmproxy:
    networks: [proxy]
  proxy-tunnel:
    networks: [proxy]

cvm:
  domain: ${SECURITY_CVM_FQDN}
  routes:
    - path: /concrete/proxy
      service: proxy-tunnel
      port: 8082
      websocket: true
      cors: false
    - path: /ca.pem
      service: mitmproxy
      port: 8081
      cors: false
