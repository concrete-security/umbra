app:
  name: dev-cvm

services:
  dev-tunnel:
    networks: [proxy]

cvm:
  domain: ${CVM_FQDN}
  routes:
    - path: /umbra/tunnel
      service: dev-tunnel
      port: 8090
      websocket: true
      cors: false
    # Transition alias for concrete-branded CLIs (<= 0.4.x).
    - path: /concrete/tunnel
      service: dev-tunnel
      port: 8090
      websocket: true
      cors: false
