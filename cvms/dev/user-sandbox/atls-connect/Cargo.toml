[package]
name = "concrete-atls-connect"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish = false
description = "Dev CVM aTLS loopback relay helper"

[[bin]]
name = "concrete-atls-connect"
path = "src/main.rs"

[dependencies]
atlas-rs = "=0.2.0"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"
