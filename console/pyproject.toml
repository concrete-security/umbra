[project]
name = "umbra-console"
version = "0.1.0"
description = "Umbra Console backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Umbra maintainers" }]
maintainers = [{ name = "Umbra maintainers" }]
license = "LicenseRef-Proprietary"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "google-re2>=1,<2",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.10,<3",
    "structlog>=25,<26",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umbra_console"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv/**",
    "/**/__pycache__/**",
    "/**/*.py[cod]",
    "/node_modules/**",
]
