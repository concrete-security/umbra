# Standalone crate (NOT a member of the repo root workspace) so it lives inside the
# Console image build context (./console) and builds in the Dockerfile builder stage.
# The empty [workspace] table makes it its own workspace root, so cargo run from here
# does not walk up to the repo root Cargo.toml.
[package]
name = "atlas-verify-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "concrete-atlas-verify"
path = "src/main.rs"

[dependencies]
# Published atlas crate — the SAME pin the CLI uses (cli/Cargo.toml). atlas stays
# untouched; we only consume it. atlas-rs already exposes mr_td + rt_mr3.
atlas-rs = "=0.2.0"
hex = "0.4"
# Direct handle on the `log` facade (already pulled by rustls' "logging" feature) so we can
# claim the global logger at startup and route ALL dependency logs to stderr — see main.rs.
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
