[package]
name = "concrete-cli"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Command-line client for the Concrete platform"

[[bin]]
name = "concrete"
path = "src/main.rs"

[lib]
name = "concrete_cli"
path = "src/lib.rs"

[dependencies]
anstyle = "1"
atlas-rs = "=0.2.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "6"
getrandom = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"
webpki-roots = "0.26"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
rstest = { version = "0.23", default-features = false }

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
