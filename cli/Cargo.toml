[package]
name = "umbra-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line client for the Umbra platform"
readme = "README.md"

[[bin]]
name = "umbra"
path = "src/main.rs"

[lib]
name = "umbra_cli"
path = "src/lib.rs"

[dependencies]
anstyle = "1"
atlas-rs = "=0.2.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
getrandom = "0.3"
home = "0.5"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"
webpki-roots = "0.26"
zeroize = { version = "1", features = ["derive"] }

# The in-process mock Console and local-state fixtures (`src/test_support.rs`) are
# compiled into the library only for `cargo test` (`cfg(test)`) or when this feature
# is on. Integration tests under `tests/` link the library as an external crate, so
# they need the feature — hence the dev-dependency on this very package below. Never
# enable it for a release build: it would ship a test HTTP server in the binary.
[features]
test-support = []

[dev-dependencies]
umbra-cli = { path = ".", features = ["test-support"] }
rstest = { version = "0.23", default-features = false }

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
