[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umbra-local-preview"
version = "0.1.0"
description = "Experimental macOS local execution for Umbra, with direct Security CVM egress"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["umbra_local*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
