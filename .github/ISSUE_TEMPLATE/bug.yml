name: Bug report
description: Report a reproducible defect without sensitive data
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include credentials here. Follow SECURITY.md for private reporting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.x.y or commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI
        - Console
        - Dev CVM
        - Security CVM
        - Installer or release
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and redact tokens, personal data, and live infrastructure identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, installation method, and relevant non-secret configuration.
