name: Security analysis

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
  push:
    # Scan security patch branches without the dev-only image publisher.
    branches: [dev, main, "codex/security-*"]
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: read

jobs:
  repository-scan:
    name: secrets, dependencies, licenses, and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: 'false'
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.13.5
          enable-cache: 'false'
      - name: Verify Hickory advisory exception guarantees
        run: |
          uv python install
          uv run --locked --project console python -m pytest -q tools/test_check_cargo_dnssec.py
          uv run --python "$(cat .python-version)" --no-project python tools/check-cargo-dnssec.py
      # Use the MIT-licensed CLI directly: gitleaks-action requires a separate
      # organization license. The release archive is exact-versioned and its
      # digest comes from the upstream release checksum manifest.
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "${archive}"' EXIT
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Scan Git history for secrets
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner .
      # Trivy understands Cargo, Python/uv, and npm lockfiles. Vulnerabilities,
      # leaked secrets, and unsafe build configuration share the high/critical
      # gate; license risk has its own stricter policy immediately below.
      - name: Scan dependencies, secrets, and build configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore.yaml
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 15m
      # CRITICAL classifications are forbidden and block release. All other
      # detected licenses remain inventoried for explicit maintainer review.
      - name: Enforce dependency license policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: 'true'
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: CRITICAL
          ignore-policy: .trivy-license-ignore.rego
          exit-code: '1'
          timeout: 15m

  dependency-review:
    name: dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0

  container-scan:
    name: container (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: console
            dockerfile: console/Dockerfile
            context: console
          - name: security-cvm
            dockerfile: cvms/security/Dockerfile
            context: cvms/security
          - name: dev-cvm
            dockerfile: cvms/dev/user-sandbox/Dockerfile
            context: .
          - name: installer
            dockerfile: ops/installer/Dockerfile
            context: ops/installer
          - name: reverse-proxy
            dockerfile: ops/reverse-proxy/Dockerfile
            context: ops/reverse-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - name: Build image from reviewed source
        env:
          IMAGE: umbra-security-scan:${{ matrix.name }}
        run: |
          mkdir -p sbom
          docker build --file "${{ matrix.dockerfile }}" --tag "${IMAGE}" "${{ matrix.context }}"
      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: umbra-security-scan:${{ matrix.name }}
          format: cyclonedx
          output: sbom/${{ matrix.name }}.cdx.json
          scanners: vuln
          timeout: 15m
      - name: Upload image SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom/${{ matrix.name }}.cdx.json
          if-no-files-found: error
      - name: Verify pip vendor exception guarantees
        if: ${{ matrix.name == 'console' || matrix.name == 'security-cvm' || matrix.name == 'dev-cvm' }}
        timeout-minutes: 2
        env:
          IMAGE: umbra-security-scan:${{ matrix.name }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p test_check_pip_vendor.py
          container="umbra-pip-vendor-${{ matrix.name }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=5s 60s docker run --rm --name "${container}" \
            --network none --read-only --user 0:0 --entrypoint /bin/sh \
            --mount "type=bind,src=${PWD}/tools/check-pip-vendor.py,dst=/tmp/check-pip-vendor.py,readonly" \
            "${IMAGE}" -c '
              python=/usr/bin/python3
              if [ -x /usr/local/bin/python3 ]; then python=/usr/local/bin/python3; fi
              exec "${python}" -I -B /tmp/check-pip-vendor.py
            '
      - name: Enforce image vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: 'true'
          scan-type: image
          image-ref: umbra-security-scan:${{ matrix.name }}
          scanners: vuln
          trivyignores: .trivyignore.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 15m
      - name: Enforce image license policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Include loose/bundled license texts as well as OS and language
          # package metadata. CRITICAL classifications block release; the full
          # inventory remains available for explicit maintainer review.
          TRIVY_LICENSE_FULL: 'true'
        with:
          version: v0.70.0
          skip-setup-trivy: 'true'
          scan-type: image
          image-ref: umbra-security-scan:${{ matrix.name }}
          scanners: license
          severity: CRITICAL
          ignore-policy: .trivy-license-ignore.rego
          exit-code: '1'
          timeout: 15m
