# Hermetic PR gate for the `dev` and `main` trunks.
#
# Source gates also cover direct, reviewed production fixes to `main`
# (enforced by branch protection — see docs/ci-cd.md).
# Neither job touches live infrastructure (no Phala / Cloudflare / Console): they
# are the same `make check` + `make test` an operator runs locally. `make check`
# does build Docker images for its smoke tests, which the GitHub-hosted runner's
# preinstalled Docker handles.
name: PR gate

on:
  pull_request:
    branches: [dev, main]

# Newer pushes to the same PR supersede in-flight runs; safe here because these
# jobs are hermetic and stateless (unlike the staging verify journey).
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'

      # rust-toolchain.toml pins the channel + components; `rustup show` installs
      # them on the runner's preinstalled rustup.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          enable-cache: 'false'

      - name: Install pinned Python
        run: uv python install

      - name: Enforce immutable Actions references
        run: uv run --locked --project console python tools/check-github-actions.py

      - name: Cache cargo and uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/uv
          key: pr-gate-${{ runner.os }}-${{ hashFiles('.python-version', 'Cargo.lock', 'rust-toolchain.toml', 'console/uv.lock', 'cvms/security/uv.lock') }}

      - name: make check
        run: make check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          enable-cache: 'false'

      - name: Install pinned Python
        run: uv python install

      - name: Cache cargo and uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/uv
          key: pr-gate-test-${{ runner.os }}-${{ hashFiles('.python-version', 'Cargo.lock', 'rust-toolchain.toml', 'console/uv.lock', 'cvms/security/uv.lock') }}

      - name: make test
        run: make test

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full pull request history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: 'false'
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          enable-cache: 'false'
      - name: Install pinned Python
        run: uv python install
      - name: Verify every pull request commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --python "$(cat .python-version)" --no-project python tools/check-dco.py "${BASE_SHA}" "${HEAD_SHA}"

  concrete-migration:
    name: Concrete migration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install the published Concrete CLI
        run: cargo install concrete-cli --version 0.4.1 --locked --root "${RUNNER_TEMP}/legacy-concrete"
      - name: Build the pinned provenance verifier
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bridge-tools"
          env GOPRIVATE= GONOSUMDB= GONOPROXY= \
            GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org CGO_ENABLED=0 \
            GOBIN="${RUNNER_TEMP}/bridge-tools" \
            go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1
      - name: Build and check the migration bridge
        env:
          UMBRA_BRIDGE_INSTALL_BASE_URL: https://install.example.com
        run: |
          set -euo pipefail
          export UMBRA_BRIDGE_VERIFIER_PATH="${RUNNER_TEMP}/bridge-tools/slsa-verifier"
          cargo build --locked -p umbra-cli --features concrete-update-bridge --bin concrete-update-bridge
          cargo test --locked -p umbra-cli --features concrete-update-bridge
          cargo clippy --locked -p umbra-cli --all-targets --features concrete-update-bridge -- -D warnings
      - name: Migrate through the real Concrete updater
        run: |
          python3 ops/cli-release/test-concrete-update-bridge.py \
            --concrete "${RUNNER_TEMP}/legacy-concrete/bin/concrete" \
            --bridge target/debug/concrete-update-bridge
