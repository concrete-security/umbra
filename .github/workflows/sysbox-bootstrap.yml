name: Sysbox bootstrap qualification
run-name: Qualify isolated Sysbox bootstrap transactions

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/sysbox-bootstrap.yml
      - ops/verify/sysbox-bootstrap/**
      - ops/verify/sysbox-build/binaries.expected.sha256

permissions:
  contents: read

concurrency:
  group: sysbox-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transactions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout qualification source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.13.5
          enable-cache: 'false'
      - name: Install pinned Python
        run: uv python install
      - name: Check source fixtures and renderer
        run: |
          set -euo pipefail
          uv run --python "$(cat .python-version)" --no-project \
            python -m unittest discover -s ops/verify/sysbox-bootstrap -p 'test_*.py' -v
      - name: Run real prefixed systemd transactions
        run: |
          set -euo pipefail
          python=$(uv run --python "$(cat .python-version)" --no-project python -c 'import sys; print(sys.executable)')
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            "$python" ops/verify/sysbox-bootstrap/systemd_harness.py \
            --output "$RUNNER_TEMP/sysbox-bootstrap"
      - name: Retain bounded transaction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sysbox-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sysbox-bootstrap/
          if-no-files-found: error
          retention-days: 14
