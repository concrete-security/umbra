name: Sysbox compatibility
run-name: Compare Sysbox against the selected Dev release

on:
  workflow_dispatch:
    inputs:
      run_compatibility:
        description: Repeat the runtime comparison as well as the binary security scan
        type: boolean
        default: true
      rebuild_candidate:
        description: Build the pinned Sysbox source with patched dependencies
        type: boolean
        default: true
      resolve_locks:
        description: Also generate proposed module locks for review (does not qualify a runtime)
        type: boolean
        default: false
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/sysbox-compatibility.yml
      - ops/verify/sysbox-compatibility.sh
      - ops/verify/sysbox-build/**
      - cvms/dev/tests/compose_smoke.sh
      - cvms/dev/tests/nested_docker_smoke.py
      - tools/test_nested_docker_smoke.py
      - tools/test_sysbox_handover.py

permissions:
  contents: read

concurrency:
  group: sysbox-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Approved published runtime from f6aed98e6ad67faa0337f5186a1086002d757e91.
  # A pin change is a new experiment, not an automatic release promotion.
  DEV_CVM_COMPOSE_SMOKE_IMAGE: ghcr.io/concrete-security/umbra-dev-cvm@sha256:8ceb3590898d28f7ee54bc06b46ad4487473988c24719bee6ab69bd80c2fb0f9
  UMBRA_NESTED_TEST_IMAGE: ubuntu@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea

jobs:
  dependency-locks:
    if: github.event_name == 'workflow_dispatch' && inputs.resolve_locks
    name: resolve dependency locks (maintenance only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout lock maintenance tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - name: Resolve proposed locks without building a runtime
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --no-cache --progress=plain \
            --target resolved-locks --output "type=local,dest=$RUNNER_TEMP/sysbox-lock-resolution" \
            ops/verify/sysbox-build
      - name: Retain proposed locks for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sysbox-proposed-locks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sysbox-lock-resolution/
          if-no-files-found: error
          retention-days: 14

  compare:
    if: github.event_name == 'workflow_dispatch' && !inputs.rebuild_candidate && inputs.run_compatibility
    name: compare nested Docker with Sysbox
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout test tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.13.5
          enable-cache: 'false'
      - name: Install pinned Python
        run: uv python install
      - name: Check failure classification and real TCP controls
        run: |
          command -v timeout
          uv run --locked --project console python -m pytest -q tools/test_nested_docker_smoke.py tools/test_sysbox_handover.py
      - name: Pull exact images without deployment credentials
        env:
          IMAGE_PULL_USER: ${{ github.actor }}
          IMAGE_PULL_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG="$RUNNER_TEMP/sysbox-image-pull"
          mkdir "$DOCKER_CONFIG"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$IMAGE_PULL_TOKEN" \
            | docker login ghcr.io --username "$IMAGE_PULL_USER" --password-stdin >/dev/null
          unset IMAGE_PULL_TOKEN
          docker pull --platform linux/amd64 "$DEV_CVM_COMPOSE_SMOKE_IMAGE"
          docker pull --platform linux/amd64 "$UMBRA_NESTED_TEST_IMAGE"
          docker image inspect "$DEV_CVM_COMPOSE_SMOKE_IMAGE" | jq -e '
            .[0] | .Os == "linux" and .Architecture == "amd64"
            and .Config.Labels["org.opencontainers.image.source"] == "https://github.com/concrete-security/umbra"
            and .Config.Labels["org.opencontainers.image.revision"] == "f6aed98e6ad67faa0337f5186a1086002d757e91"
          ' >/dev/null
      - name: Reproduce then test the fixed runtime on the same host
        run: uv run --python "$(cat .python-version)" --no-project bash ops/verify/sysbox-compatibility.sh
      - name: Retain bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sysbox-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sysbox-compatibility/
          if-no-files-found: warn
          retention-days: 14

  candidate-security:
    name: qualify candidate Sysbox binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout scanner policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: 'false'
      - name: Extract the exact candidate without executing or installing it
        if: github.event_name == 'workflow_dispatch' && !inputs.rebuild_candidate
        run: |
          set -euo pipefail
          umask 077
          package="$RUNNER_TEMP/sysbox-candidate.deb"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --connect-timeout 10 --max-time 120 --max-filesize 20000000 \
            https://github.com/nestybox/sysbox/releases/download/v0.7.1/sysbox-ce_0.7.1.linux_amd64.deb \
            --output "$package"
          printf '%s  %s\n' 9d6d5484f980d0a17f86c492c1262015c2afb66280bdb97215b79fde6a0261c5 "$package" \
            | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/sysbox-candidate" "$RUNNER_TEMP/sysbox-security"
          : > "$RUNNER_TEMP/sysbox-security/empty-ignore"
          for component in sysbox-runc sysbox-fs sysbox-mgr; do
            dpkg-deb --fsys-tarfile "$package" \
              | tar -xOf - "./usr/bin/$component" > "$RUNNER_TEMP/sysbox-candidate/$component"
            chmod 0500 "$RUNNER_TEMP/sysbox-candidate/$component"
            # go version -m parses ELF build metadata; it does not execute the binary.
            go version -m "$RUNNER_TEMP/sysbox-candidate/$component" \
              > "$RUNNER_TEMP/sysbox-security/$component.buildinfo.txt"
            sha256sum "$RUNNER_TEMP/sysbox-candidate/$component" \
              >> "$RUNNER_TEMP/sysbox-security/binaries.sha256"
          done
      - name: Build the source candidate in the disposable runner
        if: github.event_name == 'pull_request' || inputs.rebuild_candidate
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --no-cache --progress=plain \
            --output "type=local,dest=$RUNNER_TEMP/sysbox-build" ops/verify/sysbox-build
          mv "$RUNNER_TEMP/sysbox-build/bin" "$RUNNER_TEMP/sysbox-candidate"
          mv "$RUNNER_TEMP/sysbox-build/evidence" "$RUNNER_TEMP/sysbox-security"
          mv "$RUNNER_TEMP/sysbox-build/tests" "$RUNNER_TEMP/sysbox-tests"
          : > "$RUNNER_TEMP/sysbox-security/empty-ignore"
      - name: Check candidate binary vulnerabilities without exceptions
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNORE_UNFIXED: 'false'
          TRIVY_IGNOREFILE: ${{ runner.temp }}/sysbox-security/empty-ignore
        with:
          version: v0.70.0
          cache: 'false'
          list-all-pkgs: 'true'
          # fs scans source manifests; rootfs also recognizes compiled Go binaries.
          scan-type: rootfs
          scan-ref: ${{ runner.temp }}/sysbox-candidate
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/sysbox-security/vulnerabilities.json
          timeout: 15m
      - name: Require all three Go binaries to have been analyzed
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/sysbox-security/vulnerabilities.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          data = json.loads(Path(sys.argv[1]).read_text())
          results = [row for row in data.get('Results', []) if row.get('Type') == 'gobinary']
          assert {Path(row['Target']).name for row in results} == {'sysbox-runc', 'sysbox-fs', 'sysbox-mgr'}
          assert len(results) == 3
          assert all(row.get('Packages') for row in results)
          print('All three candidate Go binaries were analyzed')
          PY
      - name: Require kernel device-filter enforcement and lifetime
        if: github.event_name == 'pull_request' || inputs.rebuild_candidate
        run: |
          set -euo pipefail
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            "$RUNNER_TEMP/sysbox-tests/device-filter.test" -test.v -test.timeout=120s \
            | tee "$RUNNER_TEMP/sysbox-security/device-filter-tests.txt"
      - name: Install uv
        if: (github.event_name == 'pull_request' || inputs.rebuild_candidate) && (github.event_name == 'pull_request' || inputs.run_compatibility)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.13.5
          enable-cache: 'false'
      - name: Install pinned Python
        if: (github.event_name == 'pull_request' || inputs.rebuild_candidate) && (github.event_name == 'pull_request' || inputs.run_compatibility)
        run: uv python install
      - name: Check failure classification and real TCP controls
        if: (github.event_name == 'pull_request' || inputs.rebuild_candidate) && (github.event_name == 'pull_request' || inputs.run_compatibility)
        run: |
          command -v timeout
          uv run --locked --project console python -m pytest -q tools/test_nested_docker_smoke.py tools/test_sysbox_handover.py
      - name: Pull exact images without deployment credentials
        if: (github.event_name == 'pull_request' || inputs.rebuild_candidate) && (github.event_name == 'pull_request' || inputs.run_compatibility)
        env:
          IMAGE_PULL_USER: ${{ github.actor }}
          IMAGE_PULL_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG="$RUNNER_TEMP/sysbox-image-pull"
          mkdir "$DOCKER_CONFIG"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$IMAGE_PULL_TOKEN" \
            | docker login ghcr.io --username "$IMAGE_PULL_USER" --password-stdin >/dev/null
          unset IMAGE_PULL_TOKEN
          docker pull --platform linux/amd64 "$DEV_CVM_COMPOSE_SMOKE_IMAGE"
          docker pull --platform linux/amd64 "$UMBRA_NESTED_TEST_IMAGE"
          docker image inspect "$DEV_CVM_COMPOSE_SMOKE_IMAGE" | jq -e '
            .[0] | .Os == "linux" and .Architecture == "amd64"
            and .Config.Labels["org.opencontainers.image.source"] == "https://github.com/concrete-security/umbra"
            and .Config.Labels["org.opencontainers.image.revision"] == "f6aed98e6ad67faa0337f5186a1086002d757e91"
          ' >/dev/null
      - name: Compare the exact scanned rebuild against the old runtime
        if: (github.event_name == 'pull_request' || inputs.rebuild_candidate) && (github.event_name == 'pull_request' || inputs.run_compatibility)
        env:
          UMBRA_SYSBOX_CANDIDATE_DIR: ${{ runner.temp }}/sysbox-candidate
        run: uv run --python "$(cat .python-version)" --no-project bash ops/verify/sysbox-compatibility.sh
      - name: Package the successfully qualified candidate and provenance
        if: success() && (github.event_name == 'pull_request' || inputs.rebuild_candidate) && (github.event_name == 'pull_request' || inputs.run_compatibility)
        run: |
          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import tarfile

          root = Path(os.environ['RUNNER_TEMP'])
          candidate = root / 'sysbox-candidate'
          security = root / 'sysbox-security'
          runtime = root / 'sysbox-compatibility'
          output = root / 'sysbox-qualified-candidate'
          names = {'sysbox-runc', 'sysbox-fs', 'sysbox-mgr'}

          def digest(path, limit):
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= limit:
                  raise SystemExit(f'invalid or oversized artifact input: {path.name}')
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def manifest(path):
              rows = [line.split() for line in path.read_text().splitlines()]
              if len(rows) != 3 or any(len(row) != 2 for row in rows) or {row[1] for row in rows} != names:
                  raise SystemExit('invalid candidate checksum manifest')
              return {name: checksum for checksum, name in rows}

          expected = manifest(Path('ops/verify/sysbox-build/binaries.expected.sha256'))
          actual = {name: digest(candidate / name, 64 * 1024 * 1024) for name in sorted(names)}
          if actual != expected or actual != manifest(security / 'binaries.sha256'):
              raise SystemExit('candidate changed after build or scan')
          comparison = json.loads((runtime / 'comparison.json').read_text())
          if comparison['status'] != 'passed' or comparison['cold_handover']['status'] != 'passed':
              raise SystemExit('candidate has no successful populated cold-handover receipt')
          if (comparison['cold_handover']['rootfs_outcome'] != 'preserved'
              or comparison['default_clone_loss_control']['rootfs_outcome'] != 'rootfs-loss'
              or comparison['default_clone_loss_control']['status'] != 'passed'
              or comparison['migrates_already_cloned_rootfs'] is not False
              or comparison['manager_flags'] != ['--data-root', '/var/lib/sysbox',
                  '--disable-ovfs-on-idmapped-mount', '--disable-rootfs-cloning']):
              raise SystemExit('candidate did not qualify the declared fresh no-clone configuration')
          inputs = subprocess.check_output(['git', 'ls-files', 'ops/verify/sysbox-build'], text=True).splitlines()
          inputs += ['.github/workflows/sysbox-compatibility.yml', 'ops/verify/sysbox-compatibility.sh',
                     'cvms/dev/tests/compose_smoke.sh', 'cvms/dev/tests/nested_docker_smoke.py',
                     'tools/test_nested_docker_smoke.py', 'tools/test_sysbox_handover.py']
          if len(inputs) > 64:
              raise SystemExit('unexpected build input count')
          input_hashes = {name: digest(Path(name), 2 * 1024 * 1024) for name in sorted(inputs)}
          evidence = {
              'security/' + name: digest(security / name, 32 * 1024 * 1024)
              for name in ['vulnerabilities.json', 'device-filter-tests.txt', 'binaries.sha256']
          }
          evidence.update({
              'runtime/' + name: digest(runtime / name, 128 * 1024)
              for name in ['comparison.json', 'nested-0.6.7.json', 'nested-0.7.1.json',
                           'manager-0.6.7.txt', 'manager-0.7.1-no-rootfs-cloning.txt',
                           'default-clone/handover/before.json', 'default-clone/handover/after.json',
                           'default-clone/handover/handover.json', 'default-clone/handover/nested-candidate.json',
                           'default-clone/handover/expected-rootfs-loss.txt',
                           'no-rootfs-cloning/handover/before.json', 'no-rootfs-cloning/handover/after.json',
                           'no-rootfs-cloning/handover/handover.json', 'no-rootfs-cloning/handover/nested-candidate.json']
          })
          output.mkdir()
          archive = output / 'sysbox-candidate.tar.gz'
          # The tar preserves executable modes; upload-artifact alone does not.
          with archive.open('xb') as raw, gzip.GzipFile(fileobj=raw, mode='wb', filename='', mtime=0) as compressed:
              with tarfile.open(fileobj=compressed, mode='w') as bundle:
                  for name in sorted(names):
                      member = tarfile.TarInfo(name)
                      member.size = (candidate / name).stat().st_size
                      member.mode = 0o755
                      with (candidate / name).open('rb') as source:
                          bundle.addfile(member, source)
          with tarfile.open(archive) as bundle:
              if {member.name for member in bundle.getmembers()} != names:
                  raise SystemExit('unexpected candidate archive contents')
              for member in bundle.getmembers():
                  if not member.isfile() or hashlib.sha256(bundle.extractfile(member).read()).hexdigest() != actual[member.name]:
                      raise SystemExit('candidate archive differs from qualified bytes')
          archive_hash = digest(archive, 200 * 1024 * 1024)
          (output / 'binaries.sha256').write_text(''.join(f'{actual[name]}  {name}\n' for name in sorted(names)))
          (output / 'archive.sha256').write_text(f'{archive_hash}  {archive.name}\n')
          context = {name: os.environ[name] for name in (
              'GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_EVENT_NAME',
              'GITHUB_WORKFLOW_REF', 'GITHUB_WORKFLOW_SHA',
          )}
          if any(len(value) > 1024 for value in context.values()):
              raise SystemExit('oversized workflow context')
          provenance = {
              'schema_version': 1, 'purpose': 'diagnostic candidate; no release or deployment approval',
              'version': '0.7.1+umbra.1', 'platform': 'linux/amd64', 'workflow': context,
              'checkout_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'binaries': actual, 'archive_sha256': archive_hash, 'source_and_test_sha256': input_hashes,
              'evidence_sha256': evidence, 'dev_image': os.environ['DEV_CVM_COMPOSE_SMOKE_IMAGE'],
              'nested_image': os.environ['UMBRA_NESTED_TEST_IMAGE'],
              'manager_flags': comparison['manager_flags'],
              'migrates_already_cloned_rootfs': False,
              'not_exercised': comparison['cold_handover']['not_exercised'],
          }
          encoded = json.dumps(provenance, indent=2, sort_keys=True) + '\n'
          if len(encoded.encode()) > 32768:
              raise SystemExit('oversized candidate provenance')
          (output / 'qualification.json').write_text(encoded)
          PY
      - name: Retain the successfully qualified candidate
        if: success() && (github.event_name == 'pull_request' || inputs.rebuild_candidate) && (github.event_name == 'pull_request' || inputs.run_compatibility)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sysbox-qualified-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sysbox-qualified-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Retain rebuilt runtime evidence
        if: always() && (github.event_name == 'pull_request' || inputs.rebuild_candidate) && (github.event_name == 'pull_request' || inputs.run_compatibility)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sysbox-rebuilt-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sysbox-compatibility/
          if-no-files-found: error
          retention-days: 14
      - name: Retain candidate binary security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sysbox-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sysbox-security/
          if-no-files-found: error
          retention-days: 14
