name: Local sandbox preview
on:
  push:
    branches: [feat/local-integrated]
  pull_request:
    paths: ['console/**', 'cvms/security/**', 'cli/**', 'docs/specs/cli*.md', 'local/**', '.github/workflows/local-preview.yml', 'docs/specs/local-sandbox.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          enable-cache: false
      - run: uv run --locked --project console python -m pytest -c local/pyproject.toml local/tests
      - run: bash -n local/build-preview.sh local/install-runtime.sh
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo test --locked -p umbra-cli
      - run: cargo clippy --locked -p umbra-cli --all-targets -- -D warnings
  native:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: swift test --disable-xctest --package-path local/native
      # Compile the actual macOS/ARM64 path even on an Intel-hosted runner.
      - run: swift build --package-path local/native --triple arm64-apple-macosx14.0
