vulnerabilities:
  - id: CVE-2026-34040
    paths:
      - usr/libexec/docker/cli-plugins/docker-buildx
      - usr/libexec/docker/cli-plugins/docker-compose
    statement: >-
      Buildx and Compose are client-only plugins; this advisory affects Docker
      daemon AuthZ request-body handling. The installed Docker Engine 29.7.1 is
      patched. Remove this exception when both plugins update their embedded
      Moby dependency metadata.
    expired_at: 2026-10-01
  - id: CVE-2026-33818
    paths:
      - usr/bin/docker
      - usr/bin/docker-proxy
      - usr/bin/dockerd
      - usr/libexec/docker/cli-plugins/docker-buildx
    statement: >-
      Docker 29.7.2 and Buildx 0.36.1 are the latest signed upstream packages,
      but still embed Go 1.26.5. Remove this exception when upstream packages
      use Go 1.26.6 or newer.
    expired_at: 2026-10-01
