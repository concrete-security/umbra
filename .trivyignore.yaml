  - id: CVE-2026-56864
    paths:
      - usr/bin/dockerd
      - usr/libexec/docker/cli-plugins/docker-buildx
      - usr/libexec/docker/cli-plugins/docker-compose
      - usr/local/bin/gh
    statement: >-
      The latest upstream Docker, Buildx, Compose, and GitHub CLI artifacts
      still embed golang.org/x/mod 0.38.0. The affected GOSUMDB module-resolution
      code is not used by these shipped runtime binaries. Remove this exception
      when upstream releases embed 0.40.0 or newer.
    expired_at: 2026-10-01
