[workspace]
resolver = "2"
members = ["cli", "cvms/dev/user-sandbox/atls-connect"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Umbra maintainers"]
homepage = "https://github.com/concrete-security/umbra"
repository = "https://github.com/concrete-security/umbra"
documentation = "https://github.com/concrete-security/umbra/blob/main/README.md"
license-file = "LICENSE.txt"
rust-version = "1.92"
keywords = ["confidential-computing", "developer-tools", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.cli-install]
inherits = "release"
lto = false
codegen-units = 16
