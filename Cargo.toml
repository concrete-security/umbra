[workspace]
resolver = "2"
members = ["cli", "cvms/dev/user-sandbox/atls-connect"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
repository = "https://github.com/concrete-security/concrete"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.cli-install]
inherits = "release"
lto = false
codegen-units = 16
